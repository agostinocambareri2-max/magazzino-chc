<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Magazzino CHC — V54</title>
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;background:#eef6fb;color:#123}
#chc-loader{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center}
#chc-loader-box{max-width:520px;background:#fff;border:1px solid #b9d7ef;border-radius:18px;padding:28px;box-shadow:0 14px 40px rgba(0,0,0,.18)}
#chc-loader-spin{width:42px;height:42px;margin:0 auto 18px;border:5px solid #d8eaf7;border-top-color:#0875c9;border-radius:50%;animation:chcspin .8s linear infinite}
#chc-loader-error{display:none;color:#8b1d14;white-space:pre-wrap;line-height:1.5}
@keyframes chcspin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="chc-loader"><div id="chc-loader-box"><div id="chc-loader-spin"></div><strong>Avvio Magazzino CHC V54…</strong><p>Caricamento protetto dell’applicazione.</p><div id="chc-loader-error"></div></div></div>
<script>
(()=>{
'use strict';
const fail=(message)=>{
 const spin=document.getElementById('chc-loader-spin');
 const error=document.getElementById('chc-loader-error');
 if(spin) spin.style.display='none';
 if(error){error.style.display='block';error.textContent='Impossibile avviare l’app.\n\n'+message+'\n\nRicarica la pagina con Ctrl + F5.';}
};
(async()=>{
 try{
  if(!('DecompressionStream' in window)) throw new Error('Il browser non supporta il caricamento compresso. Usa una versione aggiornata di Chrome, Edge o Firefox.');
  const response=await fetch('./chc-core-f18e337741e56075.bin',{cache:'no-store',credentials:'same-origin'});
  if(!response.ok||!response.body) throw new Error('File applicazione non disponibile ('+response.status+').');
  const stream=response.body.pipeThrough(new DecompressionStream('gzip'));
  const appHtml=await new Response(stream).text();
  if(!appHtml.includes('SISTEMA REAGENTI CHC')) throw new Error('Contenuto applicazione non valido.');
  document.open();
  document.write(appHtml);
  document.close();
 }catch(error){
  console.error('CHC V54 loader:',error);
  fail(error&&error.message?error.message:String(error));
 }
})();
})();
</script>
</body>
</html>
